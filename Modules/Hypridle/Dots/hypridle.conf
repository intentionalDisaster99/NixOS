# Lock the screen
listener {
    timeout = 120                                                   # 2min
    on-timeout = noctalia-shell ipc call lockScreen lock            # lock screen when timeout has passed
}f dfs dfa fds f fdsfsad

# Turn off the display
listener {
    timeout = 150                                 # 2.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'           # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'             # screen on when activity is detected after timeout has fired.
 
}

# Suspend the system 
listener {
    timeout = 660                                 # 10min
    on-timeout = systemctl suspend                # suspend
}