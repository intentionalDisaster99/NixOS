general {
    lock_cmd = noctalia-shell ipc call lockScreen lock            # dbus/sysd lock command
    before_sleep_cmd = noctalia-shell ipc call lockScreen lock    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on                    # to avoid having to press a key twice to turn on the display.
}

# Dim the display
listener {
    timeout = 45                                 # 45sec.
    on-timeout = brightnessctl -s set 10         # save state and set to 10
    on-resume = brightnessctl -r                 # restore previous state
}

# Turn off keyboard backlight 
listener {
    timeout = 20                                                 # 20sec.
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd platform::kbd_backlight        # turn on keyboard backlight.
}

# Lock the screen
listener {
    timeout = 120                                                   # 2min
    on-timeout = noctalia-shell ipc call lockScreen lock            # lock screen when timeout has passed
}

# Turn off the display
listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected 
}

