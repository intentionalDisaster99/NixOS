general {
    lock_cmd = noctalia-shell ipc call lockScreen lock            # dbus/sysd lock command
    before_sleep_cmd = noctalia-shell ipc call lockScreen lock    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on                    # to avoid having to press a key twice to turn on the display.
}

# Dim the display
listener {
    timeout = 45                                                  # 45sec.
    on-timeout = for i in {1..4}; do noctalia-shell ipc call brightness decrease; done      # decrease brightness
    on-resume = for i in {1..4}; do noctalia-shell ipc call brightness increase; done       # increase brightness
}

# Dim the display again
listener {
    timeout = 90                                                  # 90sec.
    on-timeout = for i in {1..2}; do noctalia-shell ipc call brightness decrease; done      # decrease brightness
    on-resume = for i in {1..2}; do noctalia-shell ipc call brightness increase; done       # increase brightness
}

