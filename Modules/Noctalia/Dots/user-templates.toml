[config]

[templates]

# User-defined templates
# Add your custom templates below
# Example:
# [templates.myapp]
# input_path = "~/.config/noctalia/templates/myapp.css"
# output_path = "~/.config/myapp/theme.css"
# post_hook = "myapp --reload-theme"

# For hyprland lua
[templates.hyprlua]
input_path = "~/.config/noctalia/templates/hyprland-custom.lua"
output_path = "~/.config/hypr/noctalia-colors.lua"
post_hook = "sh -c 'hyprctl reload'"

[templates.neovim]
input_path = "~/.config/noctalia/templates/neovim-custom.lua"
output_path = "~/.config/nvim/lua/colors/noctalia.lua"
