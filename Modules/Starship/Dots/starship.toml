palette = "noctalia"
add_newline = false

format = """
[┌](bold green) $os$username$hostname ── $directory$git_branch$git_status
[└───> ](bold green)"""

[fill]
symbol = "─"
style = "bold green"

[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold blue"

[os.symbols]
NixOS = ""

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold cyan"

[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "bold purple"

[character]
success_symbol = "[ ➜](bold green)"
error_symbol = "[ ➜](bold red)"
vimcmd_symbol = "[ ➜](bold yellow)"


[directory]
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"




















































